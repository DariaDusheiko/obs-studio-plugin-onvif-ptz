name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"] # Запускать при пуше в main или master
  workflow_dispatch: # Позволяет запускать сборку вручную из интерфейса

# Устанавливаем права для GITHUB_TOKEN, чтобы разрешить деплой в GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только одну идущую сборку одновременно
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Копируем всё содержимое корневого репозитория (где лежит index.html)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
